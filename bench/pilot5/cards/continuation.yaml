task_prompt: | # verbatim title + blank line + body at arrival (no comments existed yet); nothing disclosed a solution, so nothing required sanitizing
  No measurement or regression gate for Hunch's context footprint

  ## Problem
  Nothing measures how many tokens Hunch puts into an agent's context, so the footprint grows release by release without anyone seeing it. A one-off measurement on 1.39.3 found: tool list 12.7k–21.4k tokens, grounding block 2.4k, ~1.8k per prompt, up to ~9k per `hunch_context` call, ~1.5k per edit on a well-anchored file (see the linked issues).

  ## Suggested direction
  - `hunch doctor --context` (or `hunch footprint`): print the fixed, per-prompt, per-edit and per-call sizes for this repo and host, in characters and estimated tokens, from the same code paths the hooks and MCP server use.
  - A test that fails when a budget is exceeded: `tools/list` size, grounding block size, SessionStart / UserPromptSubmit text, and "whole tool result ≤ k × budget_tokens" for `hunch_context`.
  - Record the numbers per release (a finding or a line in the release checklist) so a regression shows up as a diff.

  ---
  Measured 2026-09-20 on the published `@davesheffer/hunch@1.39.3` dist in the hunch repo itself (328 decisions, 51 findings). Tokens are estimated as characters / 4, not from a tokenizer. Part of the context-footprint work; the fix must hold for every MCP host, not one client.
