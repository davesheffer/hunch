  command: "copy bench/pilot5/validators/268/pilot5-issue-268.test.ts to <target worktree>/test/, then from that worktree: node node_modules/tsx/dist/cli.mjs --test test/pilot5-issue-268.test.ts" # tooling/run-tests.mjs does not exist at the starting commit
  validator_sha256: "cbe546d69eca07e78618f58a9fab122cd390e56ee5764724f646cfc5a54ff747" # single file bench/pilot5/validators/268/pilot5-issue-268.test.ts
  starting_state_result: failed
  success_criteria: >-
    exit 0. In a fresh Git repository with an empty .hunch/, the validator
    starts `hunch mcp --root <repo>` from the target's own source, calls
    `hunch_task` with action start, takes the returned `verification_argv`
    verbatim, appends a node command that exits 0 after 130 s, and runs it with
    no `--timeout` of its own. The run must exit 0, its printed result must
    carry "exit_code": 0, and it must not say "timed_out": true. Needs about
    135 s at the fix commit.
  notes: >-
    Replaces the earlier validator, which asserted only
    DEFAULT_CHECK_TIMEOUT_MS > 120000 and so pinned one constant and one
    remedy. This one tests the issue's required behaviour (a passing suite
    longer than 120 s, run the way the issue describes, is not recorded as a
    timed-out failed check) through the surfaces the issue names:
    `hunch_task start`, `verification_argv`, `hunch task verify`, and the
    `exit_code` / `timed_out` result fields. It pins no symbol outside the
    issue text; the MCP entry point (src/cli/index.ts mcp --root) is only the
    transport, unchanged at both commits. Remedies accepted: a larger default
    (15 min, the 6 h max or anything above 130 s), or a `verification_argv`
    that carries `--timeout <n>` with n above 130. Remedies not required and
    not sufficient alone: the instruction text mentioning `--timeout` (the
    starting commit's hunch_task start text already says "add --timeout
    <seconds> before -- for a long suite" and the defect still reproduces),
    rendering a timed-out check as `timed out (n s)` (the check is still cut
    off at 120 s and its passing result is lost), and the season-test opt-in
    (repository test hygiene). Not a timing race under item 2: at the start
    commit the 120 s budget is below the check's minimum duration of 130 s,
    so the kill always fires; at the fix commit the budget is 900 s.
