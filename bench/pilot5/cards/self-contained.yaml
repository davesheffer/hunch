issue_text_sha256: "19f7d5a92633dd97ece67ca45c5c02d28a224bd569aa377fbf25f524467cf580" # sha256 of UTF-8 title + "\n\n" + body; body never edited (GraphQL lastEditedAt null, userContentEdits 0)
task_prompt: "Task card hides failed checks when a later unrelated check passes\n\n## Problem\n\nThe completion card displays only the last verification command. A later pass from an unrelated check hides an earlier unresolved failure, leaving the card looking green although the full report retains a failed check.\n\nReproduced on the published Hunch 1.40.1 runtime on Windows on 2026-09-22. The same selection exists in the 1.38.1 checkout.\n\n## Reproduction\n\nIn an isolated Git repository, start a task, then run these commands using its returned task ID:\n\n```text\nhunch task verify <task-id> --label \"Integration tests\" -- node -e \"process.exit(7)\"\nhunch task verify <task-id> --label \"Lint\" -- node -e \"process.exit(0)\"\nhunch task finish <task-id>\n```\n\nKeep the source unchanged between checks. The JSON report correctly retains exit codes `[7, 0]`, with both checks current. The completion card shows only:\n\n```text\nChecked   Lint · passed · current source snapshot\n```\n\nThere is no mention of the failed integration check. The HTML report correctly shows both COMMAND FAILED and COMMAND PASSED.\n\n## Expected\n\nKeep unresolved failures visible in the compact card, or explicitly show that it summarizes only the latest check alongside the count of failures requiring inspection. Define how a successful rerun supersedes a failure so that a different check passing cannot conceal it.\n\n## Location and validation\n\n`src/core/taskReportRender.ts`, `renderTaskReport`: `const check = report.checks.at(-1)`.\n\nAn isolated runtime reproduction verified actual command exits, unchanged source snapshots, repeat completion, and invalidation after a source edit. This is a presentation defect, not evidence loss. Add regression coverage for fail-A/pass-B, fail-A/pass-A, and stale-source results.\n\nRelated Hunch finding: `fnd_e1e9d91cea`.\n" # title + body verbatim at arrival; the issue has no comments; its Expected/Location text is the issue's own suggestion, not the fix
