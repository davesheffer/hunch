# Contributor License Agreement check. Blocks a PR until every commit author has
# signed CLA.md by commenting the signing sentence on the PR. Signatures are
# committed to the `cla-signatures` branch (never main). That branch must exist,
# must not be protected, and must already hold signatures/version1/cla.json
# containing {"signedContributors": []}: at this action version a missing file
# fails with a 404 instead of being created (contributor-assistant/github-action#155).
#
# Changing CLA.md means bumping its Version and the version in
# path-to-signatures together, so each signature stays tied to the text signed.
#
# pull_request_target runs this workflow from main with a write token. That is
# safe only because no step checks out or runs the PR's code; keep it that way.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, closed, synchronize]

# One group per PR: a repo-wide group would cancel a queued signing run when a
# third run queues. Concurrent signature writes are already safe, since the
# action updates the file by sha and a conflicting write fails loudly.
concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

permissions:
  actions: write # re-runs the check after a signing comment
  contents: write # commits signatures to the cla-signatures branch
  pull-requests: write

jobs:
  cla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The action locks a PR on every close; skip closes that were not merges so
    # a closed-then-reopened PR can still be signed.
    if: >-
      (github.event_name == 'pull_request_target' &&
        (github.event.action != 'closed' || github.event.pull_request.merged)) ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/davesheffer/hunch/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          # For a commit whose email is not linked to an account, the action
          # matches this list against the raw git user.name, which anyone can
          # set. So it holds bots only (the maintainer signs like everyone
          # else), and an unlinked commit named after a bot needs a look.
          # github-actions[bot] is skipped by the action itself.
          allowlist: dependabot[bot],hunch-agent[bot]
          # Exact match, as CLA.md section 1 requires (the default is a loose regex).
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          # Locking a merged PR keeps the signing comment, the evidence of
          # signature, from being edited or deleted afterwards.
          lock-pullrequest-aftermerge: true
